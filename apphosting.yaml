runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  maxInstances: 10
  minInstances: 0

# Los secretos de cobro (Stripe y Mercado Pago) se quitaron: no los lee ningún
# archivo de src/ y su ausencia en Secret Manager rompía la compilación.
# Vuelve a declararlos cuando se porte el flujo de pagos.
#
# OJO: la clave es `env:`. Hasta el 2 oct 2026 este bloque se llamaba
# `environmentVariables:`, que App Hosting ignora en silencio: producción
# no recibía NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_WORDPRESS_API_URL ni MAP_ID.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  # Vacía en producción: mxicapp usa la base (default).
  - variable: NEXT_PUBLIC_FIRESTORE_DB_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_ID
    secret: NEXT_PUBLIC_SITE_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    secret: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WORDPRESS_API_URL
    value: https://mexicatv.com/graphql
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://comeapp.com.mx
    availability:
      - BUILD
      - RUNTIME
  # Correos de reservaciones (Resend). Sólo en ejecución: es una clave privada.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

# Antes de activar las conexiones sociales, crea en Secret Manager y agrega aquí
# (RUNTIME) INSTAGRAM_APP_ID/SECRET, FACEBOOK_APP_ID/SECRET,
# TIKTOK_CLIENT_KEY/SECRET, SOCIAL_OAUTH_STATE_SECRET,
# SOCIAL_TOKEN_ENCRYPTION_KEY y SOCIAL_SYNC_CRON_SECRET.
