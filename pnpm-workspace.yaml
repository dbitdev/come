# App Hosting construye en Linux x64, pero pnpm sólo guarda en el lockfile los
# binarios de la plataforma donde se instaló. Con sharp —que es nativo— eso
# hacía que el contenedor no pudiera cargarlo y tumbaba /lugares/[slug] y
# /chefs/[id] con un 500. Declarar las arquitecturas obliga a incluir ambos.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

# Declarar sólo sharp hacía que pnpm rechazara los scripts de los demás y el
# build de CI abortara con ERR_PNPM_IGNORED_BUILDS. La lista tiene que ser
# completa: es la que escribiría `pnpm approve-builds`.
onlyBuiltDependencies:
  - '@firebase/util'
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@firebase/util': set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
